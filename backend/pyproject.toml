[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi==0.162.7", "sqlmodel==0.0.50", "pydantic-settings==2.16.3", "alembic==1.20.1", "uvicorn[standard]==0.54.0"]
[dependency-groups]
dev = ["ruff==0.17.5", "pyright==1.1.414"]
[tool.ruff]
target-version = "py313"
line-length = 150

[tool.pyright]
pythonVersion = "3.13"
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
